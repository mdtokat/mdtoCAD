name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Derle
        run: npm run build
      - name: Playwright Chromium kur
        run: npx playwright install --with-deps chromium
      - name: Testler
        run: npx playwright test
      - name: Test raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Derlenmiş uygulama
        uses: actions/upload-artifact@v4
        with:
          name: tocad-dist
          path: dist/index.html
